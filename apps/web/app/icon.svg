<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#16a34a" />
  <!-- Đường biên sân thể thao -->
  <rect x="5" y="7" width="22" height="18" rx="2" stroke="#ffffff" stroke-width="1.8" />
  <!-- Lưới / vạch phân chia giữa sân -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="#ffffff" stroke-width="1.8" />
  <!-- Vạch khu vực giao bóng -->
  <line x1="10" y1="7" x2="10" y2="25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
  <line x1="22" y1="7" x2="22" y2="25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
  <line x1="10" y1="16" x2="22" y2="16" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
</svg>
