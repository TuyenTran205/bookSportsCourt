# labels.yml – Danh sách label cho dự án
# Dùng với: gh label create --label "name" --color "hex" --description "desc"
# Hoặc chạy: bash .github/scripts/setup-github.sh

labels:
  # Type
  - name: "type:feature"
    color: "0075ca"
    description: "Tính năng mới"
  - name: "type:bug"
    color: "d73a4a"
    description: "Lỗi cần sửa"
  - name: "type:task"
    color: "e4e669"
    description: "Tác vụ kỹ thuật"
  - name: "type:docs"
    color: "cfd3d7"
    description: "Cập nhật tài liệu"
  - name: "type:chore"
    color: "fef2c0"
    description: "Dọn dẹp, deps"

  # Area
  - name: "area:web"
    color: "bfd4f2"
    description: "Frontend Next.js"
  - name: "area:api"
    color: "d4c5f9"
    description: "Backend NestJS"
  - name: "area:shared"
    color: "f9d0c4"
    description: "packages/shared"
  - name: "area:db"
    color: "c3f0ca"
    description: "Database / Migration"
  - name: "area:infra"
    color: "fff3cd"
    description: "CI/CD, Docker, Deploy"
  - name: "area:design"
    color: "fce4ec"
    description: "Design system, UI"

  # Priority
  - name: "prio:P0"
    color: "b60205"
    description: "Bắt buộc (MVP)"
  - name: "prio:P1"
    color: "e4e11a"
    description: "Nên có"
  - name: "prio:P2"
    color: "c2e0c6"
    description: "Hướng phát triển"

  # Phase
  - name: "phase:0"
    color: "ededed"
    description: "Phase 0: Setup"
  - name: "phase:1"
    color: "e1d5f7"
    description: "Phase 1: Auth/Venue"
  - name: "phase:2"
    color: "cce5ff"
    description: "Phase 2: Booking"
  - name: "phase:3"
    color: "d4edda"
    description: "Phase 3: Owner"
  - name: "phase:4"
    color: "fff3cd"
    description: "Phase 4: Admin/Payment"
  - name: "phase:5"
    color: "f8d7da"
    description: "Phase 5: Finalize"
  - name: "phase:6"
    color: "d1ecf1"
    description: "Phase 6: Mobile"

  # Status
  - name: "status:blocked"
    color: "f9d0c4"
    description: "Issue bị chặn bởi issue khác"
