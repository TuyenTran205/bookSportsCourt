name: "Báo lỗi"
description: "Báo cáo lỗi cần sửa"
title: "[BUG] "
labels: ["type:bug"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: "Mô tả lỗi"
      description: "Lỗi xảy ra như thế nào?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Các bước tái hiện"
      value: |
        1. Vào trang ...
        2. Thực hiện ...
        3. Kết quả lỗi: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Kết quả mong đợi"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Kết quả thực tế"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Khu vực bị ảnh hưởng"
      options:
        - "area:web – Frontend"
        - "area:api – Backend"
        - "area:db – Database"
        - "area:infra – CI/Deploy"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Mức độ nghiêm trọng"
      options:
        - "P0 – Chặn demo / dùng được"
        - "P1 – Ảnh hưởng trải nghiệm"
        - "P2 – Minor"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Thông tin thêm"
      description: "Screenshot, log, môi trường (local/staging/demo)"
