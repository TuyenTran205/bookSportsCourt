name: "Tính năng mới"
description: "Đề xuất hoặc implement tính năng mới"
title: "[FEAT] "
labels: ["type:feature"]
assignees: []
body:
  - type: input
    id: feature-code
    attributes:
      label: "Mã tính năng"
      description: "Mã từ docs/02-features-by-role.md (vd: CUS-07, OWN-06, ADM-01)"
      placeholder: "CUS-XX / OWN-XX / ADM-XX"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: "Vai trò người dùng"
      options:
        - Customer
        - Owner
        - Admin
        - Internal / Hệ thống
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Độ ưu tiên"
      options:
        - "P0 – Bắt buộc (MVP)"
        - "P1 – Nên có"
        - "P2 – Hướng phát triển"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: "Phase"
      options:
        - "Phase 0 – Setup"
        - "Phase 1 – Auth/Venue"
        - "Phase 2 – Booking/Realtime"
        - "Phase 3 – Owner"
        - "Phase 4 – Admin/Payment"
        - "Phase 5 – Finalize"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Mô tả tính năng"
      description: "Ai cần gì, tại sao?"
      placeholder: |
        Là [vai trò], tôi muốn [hành động] để [mục đích].
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Tiêu chí chấp nhận (Acceptance Criteria)"
      description: "Checkbox để xác nhận tính năng hoàn thành"
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: input
    id: depends-on
    attributes:
      label: "Phụ thuộc vào"
      description: "Số issue cần hoàn thành trước (vd: #12, #15)"
      placeholder: "#XX, #YY"

  - type: dropdown
    id: estimate
    attributes:
      label: "Ước lượng"
      options:
        - "S – 1-2 ngày"
        - "M – 3-4 ngày"
        - "L – ~1 tuần"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Ghi chú kỹ thuật"
      description: "Tài liệu liên quan, API endpoint cần, schema cần..."
