# Keep-alive – Ping health endpoints chống sleep (free tier)
# MẶC ĐỊNH TẮT – Bật bằng cách thêm schedule hoặc gọi workflow_dispatch
# Khi cần demo liên tục, bật schedule: "*/10 * * * *"

name: Keep Alive

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Thời gian ping (phút)"
        default: "60"
  # schedule:
  #   - cron: "*/10 * * * *"  # Bỏ comment khi cần

jobs:
  ping:
    name: Ping services
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          curl -f "${{ vars.API_HEALTH_URL || 'https://api.booksports.example/api/v1/health' }}" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 5 || echo "Warning: Health check failed"

      - name: Ping Frontend
        run: |
          curl -f "${{ vars.FE_URL || 'https://booksports.example' }}" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 5 || echo "Warning: FE ping failed"
